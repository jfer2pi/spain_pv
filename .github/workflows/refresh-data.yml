name: Refresh data

# Monthly (and on demand): download RAIPEE from ELECTRA when it answers,
# municipality coordinates from Wikidata and REE's installed PV, pre-build
# es_solar.rds, rewrite manifest.json and commit.
on:
  schedule:
    - cron: "41 4 4 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: |
          Rscript -e 'install.packages(c("rsconnect", "shiny", "bslib", "httr2", "jsonlite", "readxl", "dplyr", "tidyr", "leaflet", "plotly", "DT", "htmltools"))'

      - name: Refresh data
        run: Rscript scripts/refresh_data.R

      - name: Catch up with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin ${{ github.ref_name }}
          git stash pop || true

      - name: Write manifest.json
        run: |
          Rscript -e 'files <- c("app.R", list.files(pattern = "(^es_municipios\\.csv|^es_ree_pv\\.csv|^es_solar\\.rds|(raipee|produccion|productores).*\\.(csv|xlsx))$", ignore.case = TRUE)); print(files); rsconnect::writeManifest(appFiles = files)'

      - name: Commit if changed
        run: |
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Refresh data snapshots"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
